<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Media graph schematic</title><desc id="desc">A source file connects to a shot, timed cue and audio. A shot links to person, object and interface profiles.</desc><rect x="0" y="0" width="1200" height="700" rx="0" fill="#17232e" stroke="none" stroke-width="2"/><text x="35" y="50" font-family="system-ui,sans-serif" font-size="22" fill="#eef4f5">MEDIA GRAPH / SOURCE-BOUND EVIDENCE</text><line x1="255" y1="300" x2="350" y2="130" stroke="#6c8794" stroke-width="3"/><line x1="255" y1="305" x2="350" y2="305" stroke="#6c8794" stroke-width="3"/><line x1="255" y1="310" x2="350" y2="490" stroke="#6c8794" stroke-width="3"/><line x1="580" y1="130" x2="850" y2="115" stroke="#6c8794" stroke-width="3"/><line x1="580" y1="130" x2="850" y2="285" stroke="#6c8794" stroke-width="3"/><line x1="580" y1="130" x2="850" y2="460" stroke="#6c8794" stroke-width="3"/><line x1="580" y1="305" x2="850" y2="115" stroke="#6c8794" stroke-width="3"/><rect x="35" y="250" width="220" height="110" rx="6" fill="#22323f" stroke="#b7c8cd" stroke-width="2"/><text x="50" y="285" font-family="system-ui,sans-serif" font-size="20" fill="#b7c8cd">SOURCE S1</text><text x="50" y="318" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">digest + duration</text><rect x="350" y="80" width="230" height="100" rx="6" fill="#22323f" stroke="#80d6cb" stroke-width="2"/><text x="365" y="115" font-family="system-ui,sans-serif" font-size="20" fill="#80d6cb">SHOT H4</text><text x="365" y="148" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">00:10–00:18</text><rect x="350" y="255" width="230" height="100" rx="6" fill="#22323f" stroke="#ffc079" stroke-width="2"/><text x="365" y="290" font-family="system-ui,sans-serif" font-size="20" fill="#ffc079">CUE C8</text><text x="365" y="323" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">00:12–00:14</text><rect x="350" y="440" width="230" height="100" rx="6" fill="#22323f" stroke="#a7d4a0" stroke-width="2"/><text x="365" y="475" font-family="system-ui,sans-serif" font-size="20" fill="#a7d4a0">AUDIO A2</text><text x="365" y="508" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">00:10–00:18</text><rect x="850" y="70" width="310" height="90" rx="6" fill="#22323f" stroke="#80d6cb" stroke-width="2"/><text x="865" y="105" font-family="system-ui,sans-serif" font-size="20" fill="#80d6cb">PERSON P1</text><text x="865" y="138" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">face + voice evidence</text><rect x="850" y="240" width="310" height="90" rx="6" fill="#22323f" stroke="#a7d4a0" stroke-width="2"/><text x="865" y="275" font-family="system-ui,sans-serif" font-size="20" fill="#a7d4a0">OBJECT O3</text><text x="865" y="308" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">observations + confidence</text><rect x="850" y="415" width="310" height="90" rx="6" fill="#22323f" stroke="#cfb1ed" stroke-width="2"/><text x="865" y="450" font-family="system-ui,sans-serif" font-size="20" fill="#cfb1ed">UI U1</text><text x="865" y="483" font-family="system-ui,sans-serif" font-size="17" fill="#eef4f5">controls + scroll links</text><text x="35" y="620" font-family="system-ui,sans-serif" font-size="19" fill="#eef4f5">SOURCE TIME → shot / cue / profile / object / UI / audio</text><text x="35" y="663" font-family="system-ui,sans-serif" font-size="18" fill="#b7c8cd">Query windows. Follow IDs. Verify coverage before editing.</text></svg>
