schema: agent-memory-schema/v1
purpose: Compact, merge-friendly, agent-to-agent project memory.
files:
  extension: .a2a.yaml
  alternate_extension: .a2a.json
  parser: PyYAML for automated YAML validation; direct text work remains available
  encoding: UTF-8
  markdown_memory: legacy-compatible; preserve existing approved formats
record_kinds:
  - fact
  - constraint
  - decision
  - observation
  - failed_attempt
  - outcome
  - handoff
limits:
  root_registry:
    max_bytes: 8192
    max_areas: 40
    max_summary_chars: 120
  area_registry:
    max_bytes: 2048
    max_kinds: 7
    max_summary_chars: 120
  kind_registry:
    max_bytes: 12288
    max_objects: 40
    max_summary_chars: 160
    max_tags: 8
  object:
    max_bytes: 4096
    max_title_chars: 96
    max_summary_chars: 160
    max_tags: 8
    max_sources: 6
    max_source_ref_chars: 180
    max_text_field_chars: 600
    max_list_items: 6
identifiers:
  area: "^[a-z][a-z0-9-]{0,47}$|^_cross-cutting$"
  kind: "fact|constraint|decision|observation|failed_attempt|outcome|handoff"
  object_id: '^(?:[a-z][a-z0-9-]{0,47}|_cross-cutting)\.(fact|constraint|decision|observation|failed_attempt|outcome|handoff)\.[a-z][a-z0-9-]{0,63}$'
  filename: '^[a-z][a-z0-9-]{0,63}\.a2a\.(?:json|yaml)$'
  date: '^\d{4}-\d{2}-\d{2}$'
  path: "relative path below docs/agent-memory; no .. segments"
root_registry:
  path: docs/agent-memory/registry.a2a.yaml
  required:
    schema: agent-memory-root-registry/v1
    version: 1
    areas: []
  area_descriptor:
    required: [id, summary, path]
    fields:
      id: functional-area identifier
      summary: <= 120 characters
      path: "<area>/registry.a2a.yaml"
    update_rule: Update only when this functional area is created, renamed, or retired.
area_registry:
  path: docs/agent-memory/<area>/registry.a2a.yaml
  required:
    schema: agent-memory-area-registry/v1
    version: 1
    area: <area>
    kinds: []
  kind_descriptor:
    required: [kind, summary, path]
    fields:
      kind: one of record_kinds
      summary: <= 120 characters
      path: "<kind>/registry.a2a.yaml"
    update_rule: Update only when this record kind is first created or retired in this area.
kind_registry:
  path: docs/agent-memory/<area>/<kind>/registry.a2a.yaml
  required:
    schema: agent-memory-kind-registry/v1
    version: 1
    area: <area>
    kind: <kind>
    objects: []
  object_descriptor:
    required: [id, title, status, summary, path, tags, recorded, updated]
    fields:
      id: "<area>.<kind>.<topic>"
      title: <= 96 characters
      status: active | proposed | approved | superseded | archived | blocked | completed | cancelled
      summary: <= 160 characters
      path: "<topic>.a2a.yaml"
      tags: up to 8 lowercase short tags
      recorded: YYYY-MM-DD
      updated: YYYY-MM-DD
    update_rule: Add or update exactly one descriptor when its object changes; do not touch parent registries.
object:
  required:
    - schema
    - id
    - kind
    - area
    - status
    - title
    - summary
    - recorded
    - updated
    - tags
    - sources
    - payload
  allowed_top_level:
    - schema
    - id
    - kind
    - area
    - status
    - title
    - summary
    - recorded
    - updated
    - tags
    - sources
    - supersedes
    - related
    - payload
  fixed_fields:
    schema: agent-memory-object/v1
    id: "<area>.<kind>.<topic>"
    kind: one of record_kinds
    area: functional-area identifier
    recorded: YYYY-MM-DD
    updated: YYYY-MM-DD
    tags: unique lowercase tags, up to 8
    sources:
      item_required: [kind, ref]
      kind: code | test | config | document | issue | task | external
      ref: concise path, identifier, or URL; up to 180 characters
    supersedes: optional list of object IDs, up to 3
    related: optional list of object IDs, up to 6
payload_by_kind:
  fact:
    required: [statement, consequence]
    allowed: [statement, consequence]
  constraint:
    required: [requirement, consequence]
    allowed: [requirement, consequence]
  decision:
    required: [problem, decision, rationale, consequences]
    allowed: [problem, context, options, decision, rationale, consequences]
  observation:
    required: [observation, follow_up]
    allowed: [observation, follow_up]
  failed_attempt:
    required: [attempt, result, cause, preferred_alternative]
    allowed: [attempt, result, cause, preferred_alternative]
  outcome:
    required: [change, result, next_action]
    allowed: [change, measurement, result, next_action]
  handoff:
    required: [objective, owner, state, expected_result]
    allowed: [objective, owner, participants, state, constraints, expected_result, outcome, blocker]
    states: [planned, active, blocked, completed, cancelled]
examples:
  root_registry: |
    schema: agent-memory-root-registry/v1
    version: 1
    areas:
      - id: billing
        summary: Payment capture, refunds, and invoice lifecycle.
        path: billing/registry.a2a.yaml
  object: |
    schema: agent-memory-object/v1
    id: billing.decision.idempotency-key
    kind: decision
    area: billing
    status: approved
    title: Use a client-supplied idempotency key for payment capture
    summary: Prevents duplicate captures when clients retry a timed-out request.
    recorded: "2026-08-08"
    updated: "2026-08-08"
    tags: [payments, api, retries]
    sources:
      - kind: code
        ref: src/Billing/CapturePayment.cs
      - kind: test
        ref: tests/Billing/CapturePaymentTests.cs
    payload:
      problem: Retried capture requests could create duplicate charges.
      decision: Persist and reuse an idempotency key per capture request.
      rationale: The payment provider guarantees replay-safe processing for the key.
      consequences:
        - Clients must generate a stable key before retrying.
        - The API rejects a reused key with different request data.
